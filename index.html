<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="rectangle">
        <div class="calculationScreen" id="calculationScreen">
        </div>
        
        <div class="buttonsContainer">
            <div class="button button-clear" data-type="clear">Clear</div>  
            <div class="button button-delete" data-type="delete">Delete</div>
            <div class="button" data-type="number" data-value="percent">%</div>     
            <div class="button" data-type="operator" data-value="plus">+</div>   
            <div class="button" data-type="number" data-value="7">7</div>  
            <div class="button" data-type="number" data-value="8">8</div>
            <div class="button" data-type="number" data-value="9">9</div>    
            <div class="button" data-type="operator" data-value="subtraction">-</div>   
            <div class="button" data-type="number" data-value="4">4</div>  
            <div class="button" data-type="number" data-value="5">5</div>
            <div class="button" data-type="number" data-value="6">6</div> 
            <div class="button" data-type="operator" data-value="impact">x</div>     
            <div class="button" data-type="number" data-value="1">1</div>  
            <div class="button" data-type="number" data-value="2">2</div>
            <div class="button" data-type="number" data-value="3">3</div>    
            <div class="button" data-type="operator" data-value="divide">÷</div> 
            <div class="button" data-type="operator" data-value="square">x²</div>     
            <div class="button" data-type="number" data-value="0">0</div>
            <div class="button" data-type="number" data-value="comma">,</div>    
            <div class="button" data-type="equals" data-value="equals">=</div>  
        </div>
        
        
    </div>

    <script src="script.js"></script>
</body>

</html>
